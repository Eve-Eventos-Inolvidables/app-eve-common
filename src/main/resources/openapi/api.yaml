openapi: 3.0.3
info:
  title: App-Eve-Common DTOs
  version: 1.2.0

paths: {}

components:
  schemas:
    # --- CLASES BASE ---

    IdentificableDto:
      type: object
      properties:
        id:
          type: integer
          format: int64

    ArchivableDto:
      allOf:
        - $ref: '#/components/schemas/IdentificableDto'
        - type: object
          properties:
            archived:
              type: boolean
              default: false

    # --- ENVELOPE ---
    # Hay un schema por forma de respuesta, NO un envelope mega. Es deliberado: springdoc
    # deriva el schema del tipo de retorno declarado, asi que si los endpoints declararan
    # un unico tipo con todos los campos, Swagger mostraria en cada endpoint campos
    # (error, pagination) que ese endpoint nunca manda.
    #
    # Cada endpoint declara el suyo:
    #   ResponseDto      -> 200 con un recurso      (getById, create, update)
    #   PagedResponseDto -> 200 con listado paginado (getByFilter)
    #   ErrorResponseDto -> 4xx/5xx con detalle
    #   y el delete devuelve 204 sin body, asi que no tiene schema.
    #
    # En las 3 formas 'success' y 'message' estan garantizados (required). Los campos
    # opcionales se omiten del JSON cuando no aplican (@JsonInclude(NON_NULL)): no mandes
    # null explicito, chequea que la clave exista.
    #
    # Estas schemas no se usan como clases Java (este spec tiene paths: {} y solo genera
    # DTOs de entidad): viven aca como contrato de cable, para que cada microservicio las
    # copie a su propio spec si quiere generar el cliente.

    ResponseDto:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Motivo del exito.
          example: Operación exitosa
        data:
          type: object
          additionalProperties: true
          description: >-
            El recurso. Sin forma fija aca: cada endpoint lo tipa con allOf
            (ej. `data: {$ref: EventCategoryDto}`).
          nullable: true

    PagedResponseDto:
      type: object
      required:
        - success
        - message
        - data
        - pagination
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación exitosa
        data:
          type: array
          description: >-
            Los items de la pagina. Sin forma fija aca: cada endpoint lo tipa con allOf.
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/PaginationDto'

    ErrorResponseDto:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Categoria del error.
          example: Recurso no encontrado
        error:
          $ref: '#/components/schemas/ErrorDetailDto'

    ErrorDetailDto:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          description: Siempre igual al status HTTP de la respuesta.
          example: 404
        message:
          type: string
          description: Detalle del fallo. En el 500 puede exponer la causa real (util para debug).

    PaginationDto:
      type: object
      required:
        - page
        - size
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          description: Indice de pagina, base 0 (el mismo `page` que se manda como query param).
          example: 0
        size:
          type: integer
          example: 20
        totalItems:
          type: integer
          format: int64
          example: 100
        totalPages:
          type: integer
          example: 5

    # --- PATRON ---
    # Por entidad se generan cuatro piezas:
    #   XBaseDto   properties, todas opcionales, SIN id/archived (son de lectura)
    #   CreateXDto   XBaseDto + required
    #   UpdateXDto  XBaseDto sola (todo opcional), solo en recursos que se editan
    #   XDto       ArchivableDto + XBaseDto, mas los campos que calcula el backend

    # --- ROLES ---

    RoleBaseDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 50

    CreateRoleDto:
      allOf:
        - $ref: '#/components/schemas/RoleBaseDto'
        - type: object
          required:
            - name

    UpdateRoleDto:
      allOf:
        - $ref: '#/components/schemas/RoleBaseDto'

    RoleDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/RoleBaseDto'

    # --- USUARIOS ---

    UserBaseDto:
      type: object
      properties:
        roleId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 125
        email:
          type: string
          format: email
          maxLength: 150


    CreateUserDto:
      allOf:
        - $ref: '#/components/schemas/UserBaseDto'
        - type: object
          required:
            - roleId
            - name
            - email
            - password
          properties:
            password:
              type: string
              maxLength: 255

    UpdateUserDto:
      allOf:
        - $ref: '#/components/schemas/UserBaseDto'
        - type: object
          properties:
            password:
              type: string
              maxLength: 255



    UserDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/UserBaseDto'

    #Full user
    FullUserDto:
      allOf:
        - $ref: '#/components/schemas/UserDto'
        - type: object
          properties:
            interests:
              type: array
              items:
                $ref: '#/components/schemas/UserInterestDto'

    # --- CATEGORIAS DE EVENTO ---

    EventCategoryBaseDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100

    CreateEventCategoryDto:
      allOf:
        - $ref: '#/components/schemas/EventCategoryBaseDto'
        - type: object
          required:
            - name

    UpdateEventCategoryDto:
      allOf:
        - $ref: '#/components/schemas/EventCategoryBaseDto'

    EventCategoryDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/EventCategoryBaseDto'

    # --- EVENTOS ---

    SimpleEventBaseDto:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          description: ID de la categoría (EventCategory)
        name:
          type: string
          maxLength: 125
        visibleStart:
          type: string
          format: date
        description:
          type: string
          maxLength: 1000
        date:
          type: string
          format: date
        kickOffTime:
          type: string
          format: partial-time
          example: "20:00:00"
        ticketsPerPersonLimit:
          type: integer
          minimum: 1
        primaryColor:
          type: string
          maxLength: 255
        secondaryColor:
          type: string
          maxLength: 255
        mapsLink:
          type: string
          maxLength: 255

    CreateSimpleEventDto:
      allOf:
        - $ref: '#/components/schemas/SimpleEventBaseDto'
        - type: object
          required:
            - name
            - visibleStart
            - date
            - kickOffTime
            - ticketsPerPersonLimit
            - primaryColor
            - secondaryColor

    UpdateSimpleEventDto:
      allOf:
        - $ref: '#/components/schemas/SimpleEventBaseDto'

    SimpleEventDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/SimpleEventBaseDto'

    # --- SECTORES ---

    SectorBaseDto:
      type: object
      properties:
        eventId:
          type: integer
          format: int64
          description: ID del evento asociado (SimpleEvent)
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          minimum: 1

    CreateSectorDto:
      allOf:
        - $ref: '#/components/schemas/SectorBaseDto'
        - type: object
          required:
            - eventId
            - name
            - capacity

    UpdateSectorDto:
      allOf:
        - $ref: '#/components/schemas/SectorBaseDto'

    SectorDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/SectorBaseDto'

    # --- BATCHES ---

    BatchBaseDto:
      type: object
      properties:
        eventId:
          type: integer
          format: int64
          description: ID del evento asociado (SimpleEvent)
        name:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    CreateBatchDto:
      allOf:
        - $ref: '#/components/schemas/BatchBaseDto'
        - type: object
          required:
            - eventId
            - name
            - startDate
            - endDate

    UpdateBatchDto:
      allOf:
        - $ref: '#/components/schemas/BatchBaseDto'

    BatchDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/BatchBaseDto'

    # --- PRECIOS POR SECTOR Y BATCH (tabla intermedia) ---

    SectorByBatchBaseDto:
      type: object
      properties:
        sectorId:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        price:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1

    CreateSectorByBatchDto:
      allOf:
        - $ref: '#/components/schemas/SectorByBatchBaseDto'
        - type: object
          required:
            - sectorId
            - batchId
            - price
            - quantity

    SectorByBatchDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/SectorByBatchBaseDto'

    # --- COMPRAS ---
    # total y date los calcula el backend, por eso no van en Create

    BuyBaseDto:
      type: object
      properties:
        eventId:
          type: integer
          format: int64
          description: ID del evento asociado (SimpleEvent)
        userId:
          type: integer
          format: int64

    CreateBuyDto:
      allOf:
        - $ref: '#/components/schemas/BuyBaseDto'
        - type: object
          required:
            - eventId
            - userId

    BuyDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/BuyBaseDto'
        - type: object
          properties:
            total:
              type: integer
              minimum: 1
              description: Calculado por el backend a partir de los tickets
            date:
              type: string
              format: partial-time
              example: "20:00:00"
              description: Momento de la compra, lo define el backend

    # --- TICKETS ---
    # qrToken lo genera el backend, por eso no va en Create

    TicketBaseDto:
      type: object
      properties:
        sectorByBatchId:
          type: integer
          format: int64
        buyId:
          type: integer
          format: int64
          description: ID de la compra asociada (Buy)

    CreateTicketDto:
      allOf:
        - $ref: '#/components/schemas/TicketBaseDto'
        - type: object
          required:
            - sectorByBatchId
            - buyId

    TicketDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/TicketBaseDto'
        - type: object
          properties:
            qrToken:
              type: string
              description: Generado por el backend

    # --- MANAGERS DE EVENTO (tabla intermedia) ---

    EventManagerBaseDto:
      type: object
      properties:
        managerId:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        assignedAt:
          type: string
          format: date

    CreateEventManagerDto:
      allOf:
        - $ref: '#/components/schemas/EventManagerBaseDto'
        - type: object
          required:
            - managerId
            - eventId
            - assignedAt

    EventManagerDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/EventManagerBaseDto'

    # --- INTERESES DEL USUARIO (tabla intermedia) ---

    UserInterestBaseDto:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        markedAt:
          type: string
          format: date

    CreateUserInterestDto:
      allOf:
        - $ref: '#/components/schemas/UserInterestBaseDto'
        - type: object
          required:
            - userId
            - categoryId
            - markedAt

    UserInterestDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - $ref: '#/components/schemas/UserInterestBaseDto'
