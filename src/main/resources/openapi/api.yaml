openapi: 3.0.3
info:
  title: App-Eve-Common DTOs
  version: 1.1.0

paths: {}

components:
  schemas:
    # --- CLASES BASE ---

    IdentificableDto:
      type: object
      properties:
        id:
          type: integer
          format: int64

    ArchivableDto:
      allOf:
        - $ref: '#/components/schemas/IdentificableDto'
        - type: object
          properties:
            archived:
              type: boolean
              default: false

    BelongToEventDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - type: object
          properties:
            eventId:
              type: integer
              format: int64
              description: ID del evento asociado (SimpleEvent)

    EventDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - type: object
          required:
            - name
            - visibleStart
          properties:
            categoryId:
              type: integer
              format: int64
              description: ID de la categoría (EventCategory)
            name:
              type: string
              maxLength: 125
            visibleStart:
              type: string
              format: date
            description:
              type: string
              maxLength: 1000

    # --- ENTIDADES CONCRETAS EXISTENTES ---

    EventCategoryDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              maxLength: 100


    SimpleEventDto:
      allOf:
        - $ref: '#/components/schemas/EventDto'
        - type: object
          required:
            - date
            - kickOffTime
            - ticketsPerPersonLimit
            - primaryColor
            - secondaryColor
          properties:
            date:
              type: string
              format: date
            kickOffTime:
              type: string
              example: "20:00:00"
            ticketsPerPersonLimit:
              type: integer
              minimum: 1
            primaryColor:
              type: string
            secondaryColor:
              type: string
            mapsLink:
              type: string

    SectorDto:
      allOf:
        - $ref: '#/components/schemas/BelongToEventDto'
        - type: object
          required:
            - name
            - capacity
          properties:
            name:
              type: string
              maxLength: 100
            capacity:
              type: integer
              minimum: 1

    BatchDto:
      allOf:
        - $ref: '#/components/schemas/BelongToEventDto'
        - type: object
          required:
            - name
            - startDate
            - endDate
          properties:
            name:
              type: string
              maxLength: 100
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date

    SectorByBatchDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - type: object
          required:
            - price
            - quantity
          properties:
            sectorId:
              type: integer
              format: int64
            batchId:
              type: integer
              format: int64
            price:
              type: integer
              minimum: 1
            quantity:
              type: integer
              minimum: 1

    # --- NUEVAS ENTIDADES (USUARIOS Y COMPRAS) ---

    RoleDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              maxLength: 50

    CreateUpdateRoleDto:
      allOf:
        - type: object
          required:
          - name
          properties:
            name:
              type: string
              maxLength: 20



    #DeFine props sin hacerlas obligatorias
    UserBaseDto:
      type: object
      properties:
        roleId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 125
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string

    # 2. Importa la base y hace obligatorios algunos campos
    CreateUserDto:
      allOf:
        - $ref: '#/components/schemas/UserBaseDto'
        - type: object
          required:
            - roleId
            - name
            - email
            - password

    # 3.actualizar, todos los campos base opcionales
    UpdateUserDto:
      allOf:
        - $ref: '#/components/schemas/UserBaseDto'
    BuyDto:
      allOf:
        - $ref: '#/components/schemas/BelongToEventDto'
        - type: object
          required:
            - userId
            - total
            - date
          properties:
            userId:
              type: integer
              format: int64
            total:
              type: integer
              minimum: 1
            date:
              type: string
    UserDto:
      allOf:
        - $ref: '#/components/schemas/ArchivableDto'
        - type: object
        - $ref: '#/components/schemas/UserBaseDto'

    #Full user
    FullUserDto:
      allOf:
        - $ref: '#/components/schemas/UserDto'
        - type: object
          properties:
            interests:
              type: array
              items:
                $ref: '#/components/schemas/UserInterestDto'

    TicketDto:
      allOf:
        - $ref: '#/components/schemas/IdentificableDto'
        - type: object
          properties:
            sectorByBatchId:
              type: integer
              format: int64
            buyId:
              type: integer
              format: int64
              description: ID de la compra asociada (Buy)
            qrToken:
              type: string

    CreateEventManagerDto:
      allOf:
        - $ref: '#/components/schemas/IdentificableDto'
        - type: object
          required:
            - managerId
            - eventId
            - assignedAt
          properties:
            managerId:
              type: integer
              format: int64
            eventId:
              type: integer
              format: int64
            assignedAt:
              type: string
              format: date

    EventManagerDto:
      allOf:
        - $ref: '#/components/schemas/IdentificableDto'
        - $ref: '#/components/schemas/CreateUserInterestDto'
        - type: object

    CreateUserInterestDto:
      allOf:
        - type: object
          required:
            - userId
            - categoryId
            - markedAt
          properties:
            userId:
              type: integer
              format: int64
            categoryId:
              type: integer
              format: int64
            markedAt:
              type: string
              format: date
    UserInterestDto:
      allOf:
        - $ref: '#/components/schemas/IdentificableDto'
        - $ref: '#/components/schemas/CreateUserInterestDto'
        - type: object
