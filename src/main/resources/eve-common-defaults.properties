# Importar el archivo con las variables privadas
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
#spring.application.name=Eve

# Swagger
springdoc.api-docs.enabled=true

# Base de datos
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Jpa
#dejamos en none, ahora usamos migraciones con liquibase (antes era create, primera vez)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true

#SLF4J
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [${spring.application.name:APP-COMMON}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [${spring.application.name:APP-COMMON}] %logger{36} - %msg%n
logging.file.name=logs/${spring.application.name:app}.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=15

# Para librerias externas solo info
logging.level.root=INFO

# Para el proyecto, obtener mas niveles de logging
logging.level.com.example=DEBUG
